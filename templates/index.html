<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Velocidade de Internet</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .results {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .result-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            padding: 20px;
            color: white;
            text-align: center;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .result-card.download {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .result-card.upload {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .result-label {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .result-value {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .result-unit {
            font-size: 12px;
            opacity: 0.8;
        }

        .loading {
            display: none;
            text-align: center;
            margin-bottom: 30px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading p {
            color: #666;
            font-size: 14px;
        }

        .button-container {
            text-align: center;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 40px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .timestamp {
            text-align: center;
            margin-top: 20px;
            color: #999;
            font-size: 12px;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            border-left: 4px solid #c33;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚡ Teste de Velocidade</h1>
            <p>Teste a velocidade da sua conexão de internet</p>
        </div>

        <div class="error" id="error"></div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Testando sua conexão...</p>
        </div>

        <div class="results" id="results">
            <div class="result-card download">
                <div class="result-label">Download</div>
                <div class="result-value" id="download">-</div>
                <div class="result-unit">Mbps</div>
            </div>
            <div class="result-card upload">
                <div class="result-label">Upload</div>
                <div class="result-value" id="upload">-</div>
                <div class="result-unit">Mbps</div>
            </div>
        </div>

        <div class="button-container">
            <button id="testBtn" onclick="startTest()">Iniciar Teste</button>
            <button id="healthBtn" onclick="checkHealth()" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); margin-left: 10px;">Verificar Conexão</button>
        </div>

        <div class="timestamp" id="timestamp"></div>
    </div>

    <script>
        async function checkHealth() {
            const error = document.getElementById('error');
            try {
                const response = await fetch('/health');
                const data = await response.json();
                
                if (data.internet) {
                    error.textContent = '✅ Conexão com internet OK! Você pode começar o teste.';
                    error.style.background = '#efe';
                    error.style.color = '#3c3';
                    error.style.borderLeft = '4px solid #3c3';
                } else {
                    error.textContent = '❌ Sem conexão com a internet. Verifique sua conexão.';
                    error.style.background = '#fee';
                    error.style.color = '#c33';
                    error.style.borderLeft = '4px solid #c33';
                }
                error.style.display = 'block';
            } catch (err) {
                error.textContent = 'Erro ao verificar conexão: ' + err.message;
                error.style.background = '#fee';
                error.style.color = '#c33';
                error.style.borderLeft = '4px solid #c33';
                error.style.display = 'block';
            }
        }

        async function startTest() {
            const btn = document.getElementById('testBtn');
            const loading = document.getElementById('loading');
            const results = document.getElementById('results');
            const error = document.getElementById('error');
            const timestamp = document.getElementById('timestamp');

            btn.disabled = true;
            btn.textContent = 'Testando...';
            loading.style.display = 'block';
            error.style.display = 'none';
            results.style.opacity = '0.5';

            try {
                const response = await fetch('/test', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || 'Erro ao realizar o teste');
                }

                document.getElementById('download').textContent = data.download;
                document.getElementById('upload').textContent = data.upload;
                timestamp.textContent = `Testado em: ${data.timestamp}`;

                results.style.opacity = '1';
            } catch (err) {
                console.error('Erro:', err);
                error.textContent = err.message || 'Erro ao realizar o teste de velocidade. Por favor, tente novamente.';
                error.style.background = '#fee';
                error.style.color = '#c33';
                error.style.borderLeft = '4px solid #c33';
                error.style.display = 'block';
                results.style.opacity = '1';
            } finally {
                loading.style.display = 'none';
                btn.disabled = false;
                btn.textContent = 'Iniciar Teste';
            }
        }
    </script>
</body>
</html>
